<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVAC Asset Lookup — NZ Steel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:   #1F4E79;
    --mid:    #2E75B6;
    --light:  #BDD7EE;
    --svc:    #DEEBF7;
    --flt:    #FCE4D6;
    --svc-dk: #1F4E79;
    --flt-dk: #833C00;
    --green:  #E2EFDA;
    --red:    #C00000;
    --bg:     #F0F4F8;
    --card:   #FFFFFF;
    --border: #D0D8E4;
    --text:   #1A1A2E;
    --muted:  #6B7280;
  }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--navy);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  header .logo {
    width: 40px; height: 40px;
    background: var(--mid);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: white; font-size: 18px; letter-spacing: -1px;
  }
  header h1 { color: white; font-size: 20px; font-weight: 600; letter-spacing: 0.3px; }
  header span { color: var(--light); font-size: 13px; margin-left: auto; }

  .search-zone {
    background: var(--navy);
    padding: 0 32px 28px;
  }
  .search-box {
    max-width: 560px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 14px 20px 14px 48px;
    font-size: 16px;
    border: 2px solid var(--mid);
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    color: white;
    outline: none;
    transition: all 0.2s;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.45); font-weight: 400; letter-spacing: 0; }
  .search-box input:focus { background: rgba(255,255,255,0.18); border-color: var(--light); }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: rgba(255,255,255,0.5); font-size: 18px;
  }
  .suggestions {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: white; border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    max-height: 220px; overflow-y: auto; z-index: 100;
  }
  .suggestion-item {
    padding: 10px 16px; cursor: pointer; font-size: 14px;
    color: var(--navy); font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: var(--svc); }
  .suggestion-item .site-hint { font-weight: 400; color: var(--muted); font-size: 12px; }

  main { padding: 28px 32px; max-width: 1100px; }

  .empty-state {
    text-align: center; padding: 80px 20px; color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  .result-card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    overflow: hidden;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .card-header {
    background: var(--navy);
    padding: 20px 24px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  }
  .asset-id-badge {
    background: var(--mid);
    color: white;
    font-size: 22px; font-weight: 800;
    padding: 6px 16px;
    border-radius: 8px;
    letter-spacing: 1px;
  }
  .asset-desc { color: var(--light); font-size: 14px; margin-top: 6px; }
  .no-filter-badge {
    background: var(--red); color: white;
    font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
    white-space: nowrap; align-self: flex-start; margin-top: 6px;
  }

  .meta-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 0; border-bottom: 1px solid var(--border);
  }
  .meta-item {
    padding: 14px 20px;
    border-right: 1px solid var(--border);
  }
  .meta-item:last-child { border-right: none; }
  .meta-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 4px; }
  .meta-value { font-size: 13px; font-weight: 600; color: var(--text); }

  .schedules {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .schedule-panel {
    padding: 20px 24px;
  }
  .schedule-panel:first-child { border-right: 1px solid var(--border); }
  .panel-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .panel-title .dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .svc-dot { background: var(--svc-dk); }
  .flt-dot { background: var(--flt-dk); }

  .date-list { display: flex; flex-direction: column; gap: 6px; }
  .date-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-radius: 7px; font-size: 13px;
  }
  .date-row.svc { background: var(--svc); }
  .date-row.flt { background: var(--flt); }
  .date-row.past { opacity: 0.45; }
  .date-val { font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  .freq-tag {
    font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 10px; color: white;
  }
  .freq-tag.svc { background: var(--svc-dk); }
  .freq-tag.flt { background: var(--flt-dk); }

  .weekly-note {
    margin-top: 10px; padding: 10px 12px;
    background: #FFF9E6; border-left: 3px solid #F59E0B;
    border-radius: 0 6px 6px 0; font-size: 12px; color: #92400E; font-weight: 600;
  }
  .no-data {
    color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 0;
  }

  .not-found {
    background: var(--card); border-radius: 12px; border: 1px solid #FCA5A5;
    padding: 32px; text-align: center; color: var(--red); font-weight: 600;
  }

  @media (max-width: 700px) {
    header, .search-zone, main { padding-left: 16px; padding-right: 16px; }
    .meta-grid { grid-template-columns: 1fr 1fr; }
    .schedules { grid-template-columns: 1fr; }
    .schedule-panel:first-child { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">RCR</div>
  <h1>HVAC Asset Lookup</h1>
  <span>NZ Steel — Planned Maintenance 2026</span>
</header>

<div class="search-zone">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Type CBA number e.g. CBA0095A" autocomplete="off" spellcheck="false">
    <div class="suggestions" id="suggestions" style="display:none"></div>
  </div>
</div>

<main>
  <div class="empty-state" id="emptyState">
    <div class="icon">🔧</div>
    <p>Enter a CBA number above to view service and filter clean schedules</p>
  </div>
  <div id="resultContainer"></div>
</main>

const today = new Date();
today.setHours(0,0,0,0);

function parseDate(str) {
  const [d,m,y] = str.split('/');
  return new Date(+y, +m-1, +d);
}

const input = document.getElementById('searchInput');
const suggestions = document.getElementById('suggestions');
const resultContainer = document.getElementById('resultContainer');
const emptyState = document.getElementById('emptyState');

const allIds = Object.keys(ASSETS).sort();

input.addEventListener('input', () => {
  const q = input.value.trim().toUpperCase();
  if (q.length < 2) { suggestions.style.display = 'none'; return; }
  const matches = allIds.filter(id => id.startsWith(q)).slice(0, 8);
  if (!matches.length) { suggestions.style.display = 'none'; return; }
  suggestions.innerHTML = matches.map(id => {
    const a = ASSETS[id];
    return `<div class="suggestion-item" onclick="selectAsset('${id}')">
      <strong>${id}</strong>
      <span class="site-hint">${a.site}</span>
    </div>`;
  }).join('');
  suggestions.style.display = 'block';
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-box')) suggestions.style.display = 'none';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = input.value.trim().toUpperCase();
    suggestions.style.display = 'none';
    showResult(q);
  }
});

function selectAsset(id) {
  input.value = id;
  suggestions.style.display = 'none';
  showResult(id);
}

function showResult(id) {
  emptyState.style.display = 'none';
  const a = ASSETS[id];
  if (!a) {
    resultContainer.innerHTML = `<div class="not-found">Asset "${id}" not found. Check the CBA number and try again.</div>`;
    return;
  }

  const svcRows = a.svc.map(s => {
    const isPast = parseDate(s.date) < today;
    return `<div class="date-row svc${isPast ? ' past' : ''}">
      <span class="date-val">${s.date}</span>
      <span class="freq-tag svc">${s.freq}</span>
    </div>`;
  }).join('') || '<p class="no-data">No service schedule found</p>';

  const fltRows = a.flt.map(f => {
    const isPast = parseDate(f.date) < today;
    return `<div class="date-row flt${isPast ? ' past' : ''}">
      <span class="date-val">${f.date}</span>
      <span class="freq-tag flt">${f.freq}</span>
    </div>`;
  }).join('') || '<p class="no-data">No filter schedule found</p>';

  const weeklyNote = a.weeklyFlt
    ? `<div class="weekly-note">⚡ This asset also has a Weekly / 2 Weekly filter clean — see dedicated filter sheets</div>`
    : '';

  const noFilterBadge = (!a.flt.length && !a.weeklyFlt)
    ? `<span class="no-filter-badge">NO FILTER ASSIGNED</span>` : '';

  resultContainer.innerHTML = `
    <div class="result-card">
      <div class="card-header">
        <div>
          <div class="asset-id-badge">${id}</div>
          <div class="asset-desc">${a.desc}</div>
          ${noFilterBadge}
        </div>
      </div>
      <div class="meta-grid">
        <div class="meta-item"><div class="meta-label">Site</div><div class="meta-value">${a.site}</div></div>
        <div class="meta-item"><div class="meta-label">Location</div><div class="meta-value">${a.loc}</div></div>
        <div class="meta-item"><div class="meta-label">Make</div><div class="meta-value">${a.make}</div></div>
        <div class="meta-item"><div class="meta-label">Model</div><div class="meta-value">${a.model}</div></div>
      </div>
      <div class="schedules">
        <div class="schedule-panel">
          <div class="panel-title"><span class="dot svc-dot"></span> Service Schedule</div>
          <div class="date-list">${svcRows}</div>
        </div>
        <div class="schedule-panel">
          <div class="panel-title"><span class="dot flt-dot"></span> Filter Cleans</div>
          <div class="date-list">${fltRows}</div>
          ${weeklyNote}
        </div>
      </div>
    </div>`;
}
</script>
